<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Let's watch tonight" />
    <meta property="og:description" content="via Streamly" />
    <title>Let's watch tonight · Streamly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Outfit, ui-rounded, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0a14;
      }
      a.card {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        text-decoration: none;
        color: #f5f3fa;
      }
      .frame {
        width: min(420px, 100%);
        text-align: center;
      }
      .poster {
        width: 100%;
        aspect-ratio: 2 / 3;
        border-radius: 28px;
        object-fit: cover;
        background: #15131f;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .kicker {
        margin: 28px 0 8px;
        font-size: 1.1rem;
        font-weight: 500;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.2;
      }
      .footer {
        margin-top: 12px;
        color: #9a93b3;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <a class="card" id="go" href="/streamly/">
      <div class="frame">
        <img class="poster" id="poster" alt="" />
        <p class="kicker">Let's watch</p>
        <h1 id="title">tonight</h1>
        <p class="footer" id="footer">via Streamly</p>
      </div>
    </a>
    <script>
      const params = new URLSearchParams(location.search)
      const to = params.get('to') || ''
      const poster = params.get('poster') || ''
      const title = params.get('title') || 'tonight'
      const service = params.get('service') || ''
      const go = document.getElementById('go')
      const posterEl = document.getElementById('poster')
      const titleEl = document.getElementById('title')
      const footerEl = document.getElementById('footer')
      titleEl.textContent = title
      document.title = `Let's watch ${title}`
      footerEl.textContent = service
        ? `tonight · via Streamly · ${service}`
        : 'tonight · via Streamly'
      if (poster) {
        posterEl.src = poster
        posterEl.alt = title
      } else {
        posterEl.remove()
      }
      if (to) {
        go.href = to
        location.replace(to)
      } else {
        go.href = '/streamly/'
      }
    </script>
  </body>
</html>
