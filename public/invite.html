<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a14" />
    <title>Let's watch tonight · Streamly</title>
    <meta
      name="description"
      content="A friend invited you to watch tonight on Streamly."
    />
    <link rel="canonical" href="https://watchstreamly.web.app/invite" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link
      rel="preload"
      href="/fonts/PlusJakartaSans.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Streamly" />
    <meta property="og:title" content="Let's watch tonight" />
    <meta
      property="og:description"
      content="A friend picked something to watch. Open to see the title and where to stream it."
    />
    <meta property="og:url" content="https://watchstreamly.web.app/invite" />
    <meta property="og:image" content="https://watchstreamly.web.app/og-v6.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Let's watch tonight" />
    <meta
      name="twitter:description"
      content="A friend picked something to watch. Open to see the title and where to stream it."
    />
    <meta name="twitter:image" content="https://watchstreamly.web.app/og-v6.jpg" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('/fonts/PlusJakartaSans.ttf') format('truetype');
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --bg: #0b0a14;
        --text: #f5f3fa;
        --muted: #9a93b3;
        --accent: #7c5cff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(ellipse 900px 500px at 50% -10%, #241c42 0%, transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 64px;
        text-align: center;
      }
      .lockup {
        display: block;
        width: min(260px, 80vw);
        height: auto;
        margin: 0 auto 28px;
      }
      .poster {
        width: min(240px, 70vw);
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 20px;
        background: #15131f;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .kicker {
        margin: 28px 0 8px;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 500;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.85rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .service {
        margin: 0 0 28px;
        color: #d8d3e8;
        font-size: 1rem;
        font-weight: 500;
      }
      .watch {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
      }
      .home {
        display: inline-block;
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .home:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="lockup" src="/logo-lockup-v3.png" alt="Streamly" />
      <img class="poster" id="poster" alt="" hidden />
      <p class="kicker">Let's watch</p>
      <h1 id="title">tonight</h1>
      <p class="service" id="service"></p>
      <a class="watch" id="watch" href="https://watchstreamly.web.app/">
        Find your next watch
      </a>
      <a class="home" href="/">Find another pick on Streamly</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const title = (params.get('t') || '').trim()
      const year = (params.get('y') || '').trim()
      const poster = (params.get('p') || '').trim()
      const service = (params.get('s') || '').trim()
      const watch = (params.get('w') || '').trim()
      const titleEl = document.getElementById('title')
      const serviceEl = document.getElementById('service')
      const posterEl = document.getElementById('poster')
      const watchEl = document.getElementById('watch')

      if (title) {
        titleEl.textContent = title
        document.title = `Let's watch ${title} · Streamly`
      }
      if (year) {
        titleEl.textContent = `${titleEl.textContent}`
      }
      serviceEl.textContent = service
        ? `Tonight on ${service}`
        : year
          ? year
          : ''
      if (poster) {
        posterEl.src = poster
        posterEl.alt = title || 'Poster'
        posterEl.hidden = false
      }
      if (watch && !/justwatch\.com|themoviedb\.org/i.test(watch)) {
        watchEl.href = watch
        watchEl.textContent = service ? `Watch on ${service}` : 'Watch'
      }
    </script>
  </body>
</html>
